name: Verify automatic updater

on:
  pull_request:
  push:
    branches: [dev, main, pilot-deploy, prod-deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate generated files
        id: generated
        continue-on-error: true
        run: python -m tools.node_dev check

      - name: Run all Python tests
        id: pytest
        continue-on-error: true
        run: python -m pytest tests/node_dev tests/jasondocs tests/release tests/integration -v

      - name: Report all Python failures
        if: always()
        env:
          GENERATED: ${{ steps.generated.outcome }}
          PYTEST: ${{ steps.pytest.outcome }}
        run: |
          printf 'generated files: %s\n' "$GENERATED"
          printf 'pytest: %s\n' "$PYTEST"
          failed=()
          [[ "$GENERATED" = success ]] || failed+=(generated-files)
          [[ "$PYTEST" = success ]] || failed+=(pytest)
          if ((${#failed[@]})); then
            printf 'Python failures: %s\n' "${failed[*]}" >&2
            exit 1
          fi

  godot:
    name: Godot and updater integration
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Restore Godot cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-cache/godot-4.7.1
          key: godot-4.7.1-windows-x86_64

      - name: Install Godot 4.7.1
        shell: pwsh
        run: |
          $destination = Join-Path $PWD ".ci-cache\godot-4.7.1"
          $godot = Get-ChildItem -LiteralPath $destination -Filter "Godot_v4.7.1-stable_win64*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $godot) {
            $archive = Join-Path $env:RUNNER_TEMP "godot.zip"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_win64.exe.zip" -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            $godot = Get-ChildItem -LiteralPath $destination -Filter "Godot_v4.7.1-stable_win64*.exe" -File | Select-Object -First 1
          }
          if ($null -eq $godot) { throw "Godot executable was not found" }
          "GODOT_BIN=$($godot.FullName.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate generated node scenes in Godot
        id: generated
        continue-on-error: true
        run: python -m tools.node_dev godot-check --godot-bin "$env:GODOT_BIN" --timeout 300

      - name: Run all Godot unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: tests/godot/run_all.sh

      - name: Run HTTP updater integration test
        id: integration
        continue-on-error: true
        shell: bash
        run: tests/integration/run_update_integration.sh

      - name: Report all Godot failures
        if: always()
        shell: pwsh
        env:
          GENERATED: ${{ steps.generated.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
        run: |
          $results = [ordered]@{
            generated_scenes = $env:GENERATED
            godot_unit = $env:UNIT
            updater_integration = $env:INTEGRATION
          }
          $results.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key): $($_.Value)" }
          $failed = @($results.GetEnumerator() | Where-Object Value -ne "success")
          if ($failed.Count -gt 0) { throw "Godot failures: $($failed.Key -join ', ')" }

  local-runtime:
    name: Local training runtime
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: local_runtime
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: local_runtime/requirements.txt

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r local_runtime/requirements.txt

      - name: Run all local runtime tests
        run: python -m pytest tests/local_runtime -v

  whitespace:
    name: Changed-file hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          elif [[ "$EVENT_NAME" == push && "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base="$EVENT_BEFORE"
          else
            base="HEAD^"
          fi
          git diff --check "$base"..HEAD

  verify:
    name: Verify
    if: always()
    needs: [python, godot, local-runtime, whitespace]
    runs-on: ubuntu-latest
    steps:
      - name: Report all job failures
        env:
          PYTHON: ${{ needs.python.result }}
          GODOT: ${{ needs.godot.result }}
          LOCAL_RUNTIME: ${{ needs['local-runtime'].result }}
          WHITESPACE: ${{ needs.whitespace.result }}
        run: |
          printf 'python: %s\n' "$PYTHON"
          printf 'godot: %s\n' "$GODOT"
          printf 'local-runtime: %s\n' "$LOCAL_RUNTIME"
          printf 'whitespace: %s\n' "$WHITESPACE"
          failed=()
          [[ "$PYTHON" = success ]] || failed+=(python)
          [[ "$GODOT" = success ]] || failed+=(godot)
          [[ "$LOCAL_RUNTIME" = success ]] || failed+=(local-runtime)
          [[ "$WHITESPACE" = success ]] || failed+=(whitespace)
          if ((${#failed[@]})); then
            printf 'Failed jobs: %s\n' "${failed[*]}" >&2
            exit 1
          fi
